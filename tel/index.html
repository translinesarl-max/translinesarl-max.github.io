<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Transline</title>
<meta name="theme-color" content="#0B1F3A">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="../favicon.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header id="top"><div class="logo"><div class="t">T</div><div>Transline<small>Suivi de flotte</small></div></div><div id="sync" class="sync wait"><span class="dot"></span><span>Mise à jour…</span></div></header>
<main id="main"></main>
<nav id="nav"></nav>
<div id="layer"></div>
<script>
'use strict';
var APP = 'https://script.google.com/macros/s/AKfycbwYCqSywyQgPE_zZVK_jqV-8NGwbzTNgcVymFX1V53CiuhOX_WUOsyawBlrDFnmNT-8/exec';
var CACHE = 'transline_tel_v1';
var MOIS_C = ['janv.','févr.','mars','avr.','mai','juin','juil.','août','sept.','oct.','nov.','déc.'];
var JOURS = ['Dimanche','Lundi','Mardi','Mercredi','Jeudi','Vendredi','Samedi'];
var JOUR_PL = 'Prend sa journée';
var TBL = {
  Vehicules: { name: 'Véhicule', dates: ['Mine','Limiteur','Tachygraphe','Attestation gaz'], label: 'Échéances tracteurs' },
  Salaries:  { name: 'Nom', dates: ['Permis','FCO','ADR','Carte chrono','Titre de séjour'], label: 'Échéances salariés' },
  Vidanges:  { name: 'Véhicule', dates: ['Prochaine vidange'], label: 'Vidanges' }
};
var D = null, TODAY;
var S = { tab: 'home', sync: 'wait', fresh: false, month: null, open: {}, fiche: null, q: '' };
var MOIS = ['janvier','février','mars','avril','mai','juin','juillet','août','septembre','octobre','novembre','décembre'];
var JOURS_C = ['Dim','Lun','Mar','Mer','Jeu','Ven','Sam'];

/* ---------- Outils ---------- */
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]; }); }
function today() { var d = new Date(); return new Date(d.getFullYear(), d.getMonth(), d.getDate()); }
function parse(s) {
  if (!s) return null; s = String(s).trim();
  var m = s.match(/^(\d{4})-(\d{2})-(\d{2})/); if (m) return new Date(+m[1], +m[2] - 1, +m[3]);
  m = s.match(/^(\d{4})-(\d{2})$/); if (m) return new Date(+m[1], +m[2] - 1, 1);
  m = s.match(/^(\d{1,2})\/(\d{4})$/); if (m) return new Date(+m[2], +m[1] - 1, 1);
  m = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})/); if (m) return new Date(+m[3], +m[2] - 1, +m[1]);
  return null;
}
function iso(d) { return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
function fmt(d) { return String(d.getDate()).padStart(2, '0') + '/' + String(d.getMonth() + 1).padStart(2, '0') + '/' + d.getFullYear(); }
function days(d) { return Math.round((d - TODAY) / 86400000); }
function stat(v) {
  var d = parse(v); if (!d) return null; var n = days(d);
  return { k: n < 0 ? 'r' : n <= 30 ? 'o' : n <= 90 ? 'y' : '', txt: fmt(d), days: n,
    rel: n < 0 ? 'en retard de ' + (-n) + ' j' : n === 0 ? "aujourd'hui" : 'dans ' + n + ' j' };
}
function statM(v) { var d = parse(v); if (!d) return null; return { k: '', txt: MOIS_C[d.getMonth()] + ' ' + d.getFullYear(), days: days(d), rel: '' }; }
function setting(k) { var r = ((D && D.Reglages) || []).filter(function (x) { return x['Clé'] === k; })[0]; return r ? r.Valeur : ''; }
function lines(k) { return String(setting(k) || '').split('\n').map(function (x) { return x.trim(); }).filter(Boolean); }
function pclass(v) { return !v ? 'none' : (v === 'Pêche' || v === JOUR_PL) ? 'red' : v === 'Geodis 95' ? 'gre' : v === 'Congés' ? 'blu' : ''; }
function toast(t) { var el = document.createElement('div'); el.className = 'toast'; el.textContent = t; document.body.appendChild(el); setTimeout(function () { el.remove(); }, 2600); }

/* ---------- Cache (affichage immédiat) ---------- */
function loadCache() { try { var c = JSON.parse(localStorage.getItem(CACHE) || 'null'); if (c && c.data) { D = c.data; S.at = c.at; } } catch (e) {} }
function saveCache() { try { localStorage.setItem(CACHE, JSON.stringify({ data: D, at: S.at })); } catch (e) {} }

/* ---------- Pont avec Transline (Google) ---------- */
var pont = null, pontWin = null, reqs = {}, reqN = 1, waitT = null;
function startPont() {
  if (pont) pont.remove();
  pontWin = null; S.sync = 'wait'; S.fresh = false; renderSync();
  pont = document.createElement('iframe'); pont.id = 'pont'; pont.title = 'Transline';
  pont.src = APP + '?vue=pont&t=' + Date.now();
  document.body.appendChild(pont);
  clearTimeout(waitT);
  waitT = setTimeout(function () { if (!S.fresh) { S.sync = 'err'; renderSync(); if (!D) render(); } }, 30000);
}
function ask(msg, done, fail) {
  if (!pontWin) { if (fail) fail('Transline n’est pas encore connecté.'); return; }
  msg.reqId = reqN++; reqs[msg.reqId] = { done: done, fail: fail };
  pontWin.postMessage(msg, '*');
}
function refresh() { if (pontWin) { S.sync = 'wait'; S.fresh = false; renderSync(); ask({ cmd: 'load' }); } else startPont(); }
window.addEventListener('message', function (e) {
  if (!/^https:\/\/[a-z0-9-]+-script\.googleusercontent\.com$/.test(e.origin)) return;
  var m = e.data || {};
  if (m.type === 'transline-ready') { pontWin = e.source; return; }
  if (m.type === 'transline-data') {
    pontWin = pontWin || e.source; clearTimeout(waitT);
    D = m.data; S.at = m.at || Date.now(); S.fresh = true; S.sync = 'ok'; saveCache();
    var r0 = reqs[m.reqId]; delete reqs[m.reqId]; if (r0 && r0.done) r0.done();
    render();
    return;
  }
  var r = reqs[m.reqId]; delete reqs[m.reqId];
  if (m.type === 'transline-ok' && r && r.done) r.done(m.res);
  if (m.type === 'transline-err') { if (r && r.fail) r.fail(m.msg); else if (!S.fresh) { S.sync = 'err'; renderSync(); } }
});
document.addEventListener('visibilitychange', function () {
  if (document.visibilityState !== 'visible') return;
  TODAY = today();
  if (!S.at || Date.now() - S.at > 30000) refresh(); else render();
});

/* ---------- Rendu ---------- */
var ICON = {
  home: '<path d="M5 12l-2 0l9 -9l9 9l-2 0"/><path d="M5 12v7a2 2 0 0 0 2 2h10a2 2 0 0 0 2 -2v-7"/><path d="M9 21v-6a2 2 0 0 1 2 -2h2a2 2 0 0 1 2 2v6"/>',
  pl: '<path d="M4 7a2 2 0 0 1 2 -2h12a2 2 0 0 1 2 2v12a2 2 0 0 1 -2 2h-12a2 2 0 0 1 -2 -2v-12z"/><path d="M16 3v4"/><path d="M8 3v4"/><path d="M4 11h16"/>',
  tr: '<path d="M7 17m-2 0a2 2 0 1 0 4 0a2 2 0 1 0 -4 0"/><path d="M17 17m-2 0a2 2 0 1 0 4 0a2 2 0 1 0 -4 0"/><path d="M5 17h-2v-11a1 1 0 0 1 1 -1h9v12m-4 0h6m4 0h2v-6h-8m0 -5h5l3 5"/>',
  sal: '<path d="M9 7m-4 0a4 4 0 1 0 8 0a4 4 0 1 0 -8 0"/><path d="M3 21v-2a4 4 0 0 1 4 -4h4a4 4 0 0 1 4 4v2"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/><path d="M21 21v-2a4 4 0 0 0 -3 -3.85"/>',
  vi: '<path d="M7.502 19.423c2.602 2.105 6.395 2.105 8.996 0c2.602 -2.105 3.262 -5.708 1.566 -8.546l-4.89 -7.26c-.42 -.625 -1.287 -.803 -1.936 -.397a1.376 1.376 0 0 0 -.41 .397l-4.893 7.26c-1.695 2.838 -1.035 6.441 1.567 8.546z"/>'
};
function svg(k) { return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + ICON[k] + '</svg>'; }
function renderNav() {
  document.getElementById('nav').innerHTML = [['home','Accueil'],['tr','Camions'],['sal','Salariés'],['vi','Vidanges'],['pl','Planning']].map(function (t) {
    return '<button type="button" class="' + (S.tab === t[0] ? 'on' : '') + '" data-tab="' + t[0] + '">' + svg(t[0]) + t[1] + '</button>';
  }).join('');
}
function renderSync() {
  var t = S.sync === 'ok' ? 'À jour' : S.sync === 'err' ? (D ? 'Pas à jour' : 'Pas de connexion') : 'Mise à jour…';
  document.querySelectorAll('.sync').forEach(function (el) { el.className = 'sync ' + S.sync; el.lastChild.textContent = t; });
}
function dueList(table) {
  var c = TBL[table], out = [];
  ((D && D[table]) || []).forEach(function (r) {
    c.dates.forEach(function (h) {
      var s = table === 'Vidanges' ? statM(r[h]) : stat(r[h]); if (!s) return;
      out.push({ table: table, id: r.id, field: h, who: r[c.name], what: table === 'Vidanges' ? 'Moteur' : h, s: s });
    });
  });
  return out.sort(function (a, b) { return a.s.days - b.s.days; });
}
function dueRow(x) {
  var what = x.field === 'Mine' ? '<span class="mine">Mine</span>' : esc(x.what);
  return '<button type="button" class="row" data-fiche="' + x.table + '" data-id="' + esc(x.id) + '" data-field="' + esc(x.field) + '">' +
    '<span><span class="who">' + esc(x.who) + '</span><br><span class="what">' + what + '</span></span>' +
    '<span class="when"><span class="pill ' + x.s.k + '">' + esc(x.s.txt) + '</span>' + (x.s.rel ? '<small>' + esc(x.s.rel) + '</small>' : '') + '</span></button>';
}
function hRow(x) {
  var what = x.field === 'Mine' ? '<span class="mine">Mine</span>' : esc(x.what);
  return '<button type="button" class="row c" data-fiche="' + x.table + '" data-id="' + esc(x.id) + '" data-field="' + esc(x.field) + '">' +
    '<span class="cl"><span class="who">' + esc(x.who) + '</span> <span class="what">' + what + '</span></span><span class="pill ' + x.s.k + '">' + esc(x.s.txt) + '</span></button>';
}
function block(table) {
  var l = dueList(table);
  return '<section class="card hb"><div class="band"><span>' + TBL[table].label + '</span><b>' + l.length + '</b></div><div class="list">' +
    (l.length ? l.map(hRow).join('') : '<p class="empty">Rien à afficher.</p>') + '</div></section>';
}
function vHome() { return block('Vehicules') + block('Salaries') + block('Vidanges'); }
function vVidanges() {
  var rows = ((D && D.Vidanges) || []).slice().sort(function (a, b) { return ((parse(a['Prochaine vidange']) || 9e15) - (parse(b['Prochaine vidange']) || 9e15)) || String(a['Véhicule']).localeCompare(String(b['Véhicule']), 'fr', { numeric: true }); });
  return '<section class="card"><div class="band"><span>Vidanges</span><b>' + rows.length + '</b></div><div class="list">' + (rows.map(function (r) {
    var m = statM(r['Prochaine vidange']), bx = statM(r['Vidange boîte']);
    return '<button type="button" class="row" data-fiche="Vidanges" data-id="' + esc(r.id) + '" data-field="Prochaine vidange"><span><span class="who">' + esc(r['Véhicule']) + '</span><br><span class="what">Moteur' + (bx ? ' · boîte ' + esc(bx.txt) : '') + '</span></span>' +
      '<span class="when"><span class="pill">' + esc(m ? m.txt : '—') + '</span></span></button>';
  }).join('') || '<p class="empty">Aucune vidange.</p>') + '</div></section>';
}
function isWork(d) { return d.getDay() !== 0 && d.getDay() !== 6; }
function shiftDay(d, k) { var x = new Date(d.getFullYear(), d.getMonth(), d.getDate() + k); while (!isWork(x)) x.setDate(x.getDate() + (k < 0 ? -1 : 1)); return x; }
function planVal(date, who) { var r = (D.Planning || []).filter(function (x) { return x.Date === date && x.Conducteur === who; })[0]; return r ? r.Valeur : ''; }
function offOn(who, d) {
  var c = (D.Conges || []).filter(function (c) { var f = parse(c['Début']), t = parse(c.Fin) || f; return c['Salarié'] === who && f && f <= d && t >= d; })[0];
  return c ? c.Type || 'Congés' : '';
}
var ABR = { 'Geodis 95': 'Geo 95', 'BM France': 'BM Fr', 'BM Italie': 'BM It', 'Prend sa journée': 'Journée', 'Relais nuit': 'Relais', 'FÉRIÉ': 'Férié' };
function abr(v) { return ABR[v] || (v.length > 7 ? v.slice(0, 6) + '.' : v); }
function vPlanning() {
  if (!S.month) S.month = new Date(TODAY.getFullYear(), TODAY.getMonth(), 1);
  var y = S.month.getFullYear(), mo = S.month.getMonth(), drivers = lines('conducteurs').slice(0, 6);
  var stab = {}; lines('stabilo').forEach(function (k) { stab[k] = true; });
  var notes = {}; try { notes = JSON.parse(setting('notes_cases') || '{}') || {}; } catch (e) {}
  var h = '<div class="mbar"><button type="button" data-month="-1" aria-label="Mois précédent">‹</button><h2>' + MOIS[mo] + ' ' + y + '</h2><button type="button" data-month="1" aria-label="Mois suivant">›</button></div>';
  if (!drivers.length) return h + '<p class="empty">Aucun conducteur dans le planning.</p>';
  h += '<div class="pvwrap"><table class="pv"><thead><tr><th class="pd"></th>' + drivers.map(function (d) { return '<th>' + esc(d.length > 8 ? d.slice(0, 7) + '.' : d) + '</th>'; }).join('') + '</tr></thead><tbody>';
  for (var d = new Date(y, mo, 1); d.getMonth() === mo; d.setDate(d.getDate() + 1)) {
    if (!isWork(d)) continue;
    var di = iso(d);
    h += '<tr' + (di === iso(TODAY) ? ' class="today"' : '') + '><td class="pd">' + d.getDate() + '<small>' + JOURS_C[d.getDay()].slice(0, 2) + '</small></td>';
    drivers.forEach(function (who) {
      var v = planVal(di, who), k = di + '|' + who;
      h += '<td class="' + (v ? pclass(v) : '') + (stab[k] ? ' hl' : '') + (notes[k] ? ' nt' : '') + '">' + (v ? '<span>' + esc(abr(v)) + '</span>' : '') + '</td>';
    });
    h += '</tr>';
  }
  return h + '</tbody></table></div><p class="hint">Consultation seulement · le planning se modifie sur l’ordinateur</p>';
}
function vList(table) {
  var c = TBL[table], q = S.q.toLowerCase();
  var rows = ((D && D[table]) || []).filter(function (r) { return !q || String(r[c.name]).toLowerCase().indexOf(q) >= 0; })
    .sort(function (a, b) { return String(a[c.name]).localeCompare(String(b[c.name]), 'fr', { numeric: true }); });
  var h = '<input class="search" id="q" type="search" placeholder="' + (table === 'Vehicules' ? 'Chercher un camion' : 'Chercher un salarié') + '" value="' + esc(S.q) + '">';
  if (table === 'Salaries') h += '<div class="twobtn"><button type="button" class="btn" data-view="conges">Congés et journées</button><button type="button" class="btn" data-view="aco">Acomptes</button></div>';
  return h + '<section class="card"><div class="band"><span>' + (table === 'Vehicules' ? 'Camions' : 'Salariés') + '</span><b>' + rows.length + '</b></div><div class="list">' + (rows.map(function (r) {
    var worst = null;
    c.dates.forEach(function (f) { var s = stat(r[f]); if (s && (!worst || s.days < worst.days)) { worst = s; worst.f = f; } });
    return '<button type="button" class="row" data-fiche="' + table + '" data-id="' + esc(r.id) + '"><span><span class="who">' + esc(r[c.name]) + '</span>' +
      (worst ? '<br><span class="what">' + esc(worst.f) + '</span>' : '') + '</span><span class="when">' + (worst ? '<span class="pill ' + worst.k + '">' + esc(worst.txt) + '</span><small>' + esc(worst.rel) + '</small>' : '—') + '</span></button>';
  }).join('') || '<p class="empty">Aucune fiche.</p>') + '</div></section>';
}
function vBoot() {
  return '<div class="boot"><div class="t">T</div>' + (S.sync === 'err' ?
    '<div>Transline ne répond pas.<br>Vérifiez le réseau, ou que vous êtes connecté à Google dans Chrome.</div><button type="button" class="btn pri" data-act="retry">Réessayer</button><button type="button" class="btn" data-act="login">Se connecter à Google</button>' :
    '<div>Première ouverture : chargement de vos données…</div>') + '</div>';
}
function render() {
  TODAY = TODAY || today();
  renderNav(); renderSync();
  var m = document.getElementById('main'), h, g0 = document.getElementById('gw'), keep = g0 && S.tab === 'pl' ? [g0.scrollLeft, g0.scrollTop] : null;
  if (!D) h = vBoot();
  else if (S.tab === 'pl') h = vPlanning();
  else if (S.tab === 'tr') h = vList('Vehicules');
  else if (S.tab === 'sal') h = vList('Salaries');
  else if (S.tab === 'vi') h = vVidanges();
  else h = vHome();
  m.className = D && S.tab === 'home' ? 'home' : '';
  m.innerHTML = h;
  fitHome();
  var g1 = document.getElementById('gw'); if (keep && g1) { g1.scrollLeft = keep[0]; g1.scrollTop = keep[1]; }
  renderLayer();
}

function fitHome() {
  var m = document.getElementById('main');
  var nh = document.getElementById('nav').offsetHeight;
  if (m.className !== 'home') { m.style.height = ''; document.body.style.paddingBottom = ''; return; }
  document.body.style.paddingBottom = nh + 'px';
  m.style.height = Math.max(420, window.innerHeight - document.getElementById('top').offsetHeight - nh) + 'px';
}
window.addEventListener('resize', fitHome);

/* ---------- Fiches et listes en plein écran (consultation seulement) ---------- */
function rowOf(table, id) { return ((D && D[table]) || []).filter(function (r) { return r.id === id; })[0]; }
function num(v) { return +String(v || '').replace(/\s/g, '').replace(',', '.') || 0; }
function money(n) { return (Math.round(num(n) * 100) / 100).toLocaleString('fr-FR', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + ' €'; }
function kmTxt(v) { var n = num(v); return n ? Math.round(n).toLocaleString('fr-FR') + ' km' : ''; }
function dline(label, s, focus) {
  return '<div class="row ro' + (focus ? ' focus' : '') + '"><span class="who">' + label + '</span><span class="when">' + (s ? '<span class="pill ' + s.k + '">' + esc(s.txt) + '</span>' + (s.rel ? '<small>' + esc(s.rel) + '</small>' : '') : '<span class="pill">—</span>') + '</span></div>';
}
function card(title, nb, inner) { return '<section class="card"><div class="band"><span>' + title + '</span>' + (nb != null ? '<b>' + nb + '</b>' : '') + '</div><div class="list">' + inner + '</div></section>'; }
function congeRows(list) {
  return list.map(function (c) {
    var f = parse(c['Début']), t = parse(c.Fin) || f, k = !f ? '' : t < TODAY ? '' : f <= TODAY ? 'y' : days(f) <= 45 ? 'r' : 'g';
    return '<div class="row ro"><span><span class="who">' + esc(c['Salarié']) + '</span><br><span class="what">' + esc(c.Type || 'Congés') + '</span></span><span class="when"><span class="pill ' + (c.Type === 'Congés' ? k : '') + '">' + (f ? fmt(f) : '—') + '</span>' + (t && +t !== +f ? '<small>au ' + fmt(t) + '</small>' : '') + '</span></div>';
  }).join('');
}
function acoRows(list, withName) {
  return list.map(function (r) {
    var d = parse(r.Date);
    return '<div class="row ro"><span><span class="who">' + (withName ? esc(r['Salarié']) : (d ? fmt(d) : '—')) + '</span><br><span class="what">' + (withName && d ? fmt(d) + ' · ' : '') + esc(r['Mode de paiement'] || '') + (r['À retenir sur la paie de'] ? ' · paie de ' + esc(r['À retenir sur la paie de']) : '') + (r.Remarques ? ' · ' + esc(r.Remarques) : '') + '</span></span><span class="when"><span class="pill">' + money(r.Montant) + '</span></span></div>';
  }).join('');
}
function sortCg(list) {
  var rank = function (c) { var f = parse(c['Début']), t = parse(c.Fin) || f; return !f ? 3 : t < TODAY ? 3 : f <= TODAY ? 0 : 1; };
  return list.slice().sort(function (a, b) { var ra = rank(a), rb = rank(b); if (ra !== rb) return ra - rb; var fa = parse(a['Début']) || 0, fb = parse(b['Début']) || 0; return ra === 3 ? fb - fa : fa - fb; });
}
function byDateDesc(list) { return list.slice().sort(function (a, b) { return (parse(b.Date) || 0) - (parse(a.Date) || 0); }); }
function vEntretien(veh) {
  var l = byDateDesc((D.Entretien || []).filter(function (e) { return e['Véhicule'] === veh; }));
  return card('Carnet d’entretien', l.length, l.map(function (e) {
    var d = parse(e.Date), sub = [e.Type, kmTxt(e['Kilométrage']), e.Garage].filter(Boolean).join(' · ');
    return '<div class="row ro top"><span><span class="who">' + (d ? fmt(d) : '—') + '</span><br><span class="what">' + esc(sub) + '</span>' + (e.Description ? '<span class="desc">' + esc(e.Description) + '</span>' : '') + (e.Remarques ? '<span class="desc mu">' + esc(e.Remarques) + '</span>' : '') + '</span>' +
      '<span class="when">' + (num(e['Montant HT']) ? '<span class="pill">' + money(e['Montant HT']) + ' HT</span>' : '') + (e['N° de facture'] ? '<small>Fact. ' + esc(e['N° de facture']) + '</small>' : '') + '</span></div>';
  }).join('') || '<p class="empty">Aucune intervention enregistrée.</p>');
}
function layerShell(title, body) {
  return '<div class="layer"><header><div class="logo"><button type="button" class="back" data-act="close" aria-label="Retour">‹</button>' + esc(title) + '</div>' + document.getElementById('sync').outerHTML.replace('id="sync"', '') + '</header><div class="body">' + body + '<p class="hint" style="margin-top:12px">Consultation seulement · les modifications se font sur l’ordinateur</p></div></div>';
}
function renderLayer() {
  var L = document.getElementById('layer'), h = '', F = S.fiche;
  if (F && F.view === 'conges') {
    var cg = sortCg(D.Conges || []), isC = function (c) { return c.Type === 'Congés'; };
    h = layerShell('Congés et journées', card('Congés', cg.filter(isC).length, congeRows(cg.filter(isC)) || '<p class="empty">Aucun congé.</p>') + card('Journées', cg.filter(function (c) { return !isC(c); }).length, congeRows(cg.filter(function (c) { return !isC(c); })) || '<p class="empty">Aucune journée.</p>'));
  } else if (F && F.view === 'aco') {
    var ac = byDateDesc(D.Acomptes || []), tot = 0, nb = 0;
    ac.forEach(function (r) { var d = parse(r.Date); if (d && d.getMonth() === TODAY.getMonth() && d.getFullYear() === TODAY.getFullYear()) { tot += num(r.Montant); nb++; } });
    h = layerShell('Acomptes', '<div class="kpi"><div><small>Versés en ' + MOIS[TODAY.getMonth()] + '</small><b>' + money(tot) + '</b></div><div><small>Nombre ce mois</small><b>' + nb + '</b></div></div>' + card('Acomptes', ac.length, acoRows(ac, true) || '<p class="empty">Aucun acompte.</p>'));
  } else if (F) {
    var r = rowOf(F.table, F.id), c = TBL[F.table];
    if (!r) S.fiche = null;
    else if (F.table === 'Vidanges') {
      var bx = statM(r['Vidange boîte']);
      h = layerShell('Vidanges ' + r['Véhicule'], card('Vidanges', null, dline('Vidange moteur', statM(r['Prochaine vidange']), F.field === 'Prochaine vidange') + dline('Vidange boîte', bx) + (kmTxt(r['Km boîte']) ? '<div class="row ro"><span class="who">Boîte (km)</span><span class="when"><span class="pill">' + kmTxt(r['Km boîte']) + '</span></span></div>' : '')) + vEntretien(r['Véhicule']));
    } else if (F.table === 'Vehicules') {
      var vd = (D.Vidanges || []).filter(function (x) { return x['Véhicule'] === r['Véhicule']; })[0];
      h = layerShell(r['Véhicule'], card('Échéances', null, c.dates.map(function (f) { return dline(f === 'Mine' ? '<span class="mine">Mine</span>' : esc(f), stat(r[f]), F.field === f); }).join('') +
        (vd ? dline('Vidange moteur', statM(vd['Prochaine vidange'])) : '') + (r.Pneus ? '<div class="row ro"><span class="who">Pneus</span><span class="when"><span class="pill">' + esc(r.Pneus) + '</span></span></div>' : '')) + vEntretien(r['Véhicule']));
    } else {
      var who = r.Nom, cgs = sortCg((D.Conges || []).filter(function (x) { return x['Salarié'] === who; })), acs = byDateDesc((D.Acomptes || []).filter(function (x) { return x['Salarié'] === who; }));
      h = layerShell(who, card('Échéances', null, c.dates.map(function (f) { return dline(esc(f), stat(r[f]), F.field === f); }).join('')) +
        card('Congés et journées', cgs.length, congeRows(cgs) || '<p class="empty">Aucun congé ni journée.</p>') + card('Acomptes', acs.length, acoRows(acs, false) || '<p class="empty">Aucun acompte.</p>'));
    }
  }
  L.innerHTML = h;
  var fe = L.querySelector('.row.focus'); if (fe) fe.scrollIntoView({ block: 'center' });
}

/* ---------- Navigation (bouton retour Android) ---------- */
function push(kind) { history.pushState({ k: kind }, ''); }
window.addEventListener('popstate', function () {
  if (S.fiche) S.fiche = S.fiche.prev || null;
  else if (S.tab !== 'home') { S.tab = 'home'; S.q = ''; window.scrollTo(0, 0); }
  render();
});
function closeTop() { history.back(); }

/* ---------- Actions ---------- */
document.addEventListener('click', function (e) {
  var b = e.target.closest('button,[data-act]'); if (!b) return;
  if (b.dataset.stop) return;
  var a = b.dataset.act;
  if (b.dataset.tab) {
    var t = b.dataset.tab; if (t === S.tab) { window.scrollTo(0, 0); return; }
    if (S.tab === 'home') push('tab'); else if (t === 'home') { history.back(); return; }
    S.tab = t; S.q = ''; if (t === 'pl') S.month = null; window.scrollTo(0, 0); render(); return;
  }
  if (b.dataset.more) { S.open[b.dataset.more] = !S.open[b.dataset.more]; render(); return; }
  if (b.dataset.fiche) { var prev = S.fiche; S.fiche = { table: b.dataset.fiche, id: b.dataset.id, field: b.dataset.field || '', prev: prev }; push('fiche'); renderLayer(); return; }
  if (b.dataset.month) { S.month = new Date(S.month.getFullYear(), S.month.getMonth() + (+b.dataset.month), 1); render(); return; }
  if (b.dataset.view) { S.fiche = { view: b.dataset.view, prev: S.fiche }; push('fiche'); renderLayer(); return; }
  if (a === 'close') { closeTop(); return; }
  if (a === 'retry') { startPont(); render(); return; }
  if (a === 'login') { location.href = APP; return; }
});
document.addEventListener('input', function (e) { if (e.target.id === 'q') { S.q = e.target.value; var p = e.target.selectionStart; render(); var q = document.getElementById('q'); q.focus(); q.setSelectionRange(p, p); } });

/* ---------- Démarrage ---------- */
TODAY = today();
history.replaceState({ k: 'root' }, '');
loadCache();
render();
startPont();
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js', { scope: './' });
</script>
